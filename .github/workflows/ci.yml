name: Native builds

on:
  push:
  pull_request:

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create .env
        working-directory: android
        env:
          API_KEY: ${{ secrets.API_KEY || 'XXX-YYY-ZZZ' }}
        run: printf 'ENABLE_LOGS=true\nAPI_KEY=%s\n' "$API_KEY" > .env
      - name: Unit tests with logging disabled
        working-directory: android
        run: |
          sed -i 's/^ENABLE_LOGS=.*/ENABLE_LOGS=false/' .env
          ./gradlew testDebugUnitTest
          echo "::notice title=ENABLE_LOGS=false::$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -c '<testcase') unit tests passed"
      - name: Unit tests with logging enabled
        working-directory: android
        run: |
          sed -i 's/^ENABLE_LOGS=.*/ENABLE_LOGS=true/' .env
          ./gradlew testDebugUnitTest
          echo "::notice title=ENABLE_LOGS=true::$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -c '<testcase') unit tests passed"
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/HelloWorld/HelloWorld.xcodeproj
          -scheme HelloWorld
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/HelloWorld/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/HelloWorld/DerivedData/Build/Products/Debug-iphonesimulator/HelloWorld.app