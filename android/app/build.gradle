plugins {
    id 'com.android.application'
    id 'earth.levi.dotenv-android' version '1.3.0'
}

dotenv {
    packageName = 'com.example.helloworld'
    sourcePath = 'src/main/java/'
}

android {
    namespace 'com.example.helloworld'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.helloworld'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    testOptions {
        unitTests.all {
            systemProperty 'dotenv.file', rootProject.file('.env').absolutePath
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
